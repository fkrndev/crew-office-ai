[package]
name = "agent-office"
version = "0.1.0"
description = "Multi-agent office harness"
edition = "2021"
rust-version = "1.90"
default-run = "agent-office"

[lib]
name = "agent_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# image-png enables tauri::image::Image::from_bytes — clipboard_save_image
# decodes PNG bytes through it before write_image.
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tiny_http = "0.12"
jsonschema = "0.30"
keyring = "3"
ureq = { version = "3", features = ["json"] }
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
log = "0.4.34"
# `test` enables tauri::test (mock_app + the noop Wry runtime) so unit tests
# can exercise code paths that carry an AppHandle without a real window.
[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_RemoteDesktop"] }
junction = "1"
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
