<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Office</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://ipc.localhost https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com tauri: ipc:; media-src 'self' blob: mediastream:;"
    />
    <!-- Fonts are BUNDLED (src/design/fonts.css) rather than fetched from a
         CDN, matching the upstream CSP — no remote font host is allowed. -->
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #EEF2F6; color: #0F1C2E;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 56px; height: 56px;
        background: #1B9890; color: #0F1C2E; border: 4px solid #0F1C2E;
        font-family: "Press Start 2P", monospace; font-size: 16px; letter-spacing: -2px;
        box-shadow: 4px 4px 0 rgba(15,28,46,0.25);
      }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 13px; }
      #cth-splash .hint { font-size: 15px; color: #50627A; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">AO</div>
        <div class="title">AGENT OFFICE</div>
        <div class="hint">Opening the office…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
